# Capsule reverse proxy - hostname routing (HTTP only)
# Update the host → backend mapping below as part of platform configuration.
# Hostnames are defined a priori by system architects and DNS records.

map $host $backend_upstream {
    default                 host.containers.internal:8080;
    docs.internal.corp      host.containers.internal:8080;
    wiki.internal.corp      host.containers.internal:8081;
}

server {
    listen 8080;
    server_name _;

    access_log off;
    server_tokens off;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;

        proxy_pass http://$backend_upstream;
    }
}
