<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
  </defs>

  <!-- Clean rounded icon container -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>

  <!-- Architecture node blocks (C4 / Diagram as code) -->
  <rect x="5" y="6" width="9" height="7" rx="1.8" fill="#ffffff" stroke="#ffffff" stroke-width="0.5"/>
  <rect x="18" y="6" width="9" height="7" rx="1.8" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="1.2"/>
  <rect x="11.5" y="19" width="9" height="7" rx="1.8" fill="#ffffff" stroke="#ffffff" stroke-width="0.5"/>

  <!-- Relationship connector lines -->
  <path d="M 14 9.5 L 18 9.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 9.5 13 L 9.5 16 L 12 19" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22.5 13 L 22.5 16 L 20 19" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Code symbol indicator in top-right node </> -->
  <path d="M 20.5 8.5 L 19.5 9.5 L 20.5 10.5" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 24.5 8.5 L 25.5 9.5 L 24.5 10.5" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 23 7.8 L 22 11.2" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round"/>
</svg>
